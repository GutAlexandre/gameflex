<!doctype html><html lang="fr"><meta charset="utf-8"><title>GameFlex · validation mobile</title><style>html,body{margin:0;width:100%;height:100%;background:#15151b;color:#dedce8;font:12px system-ui}body{display:flex;align-items:center;justify-content:center}iframe{width:430px;height:780px;border:0;background:#171416;border-radius:18px}.controls{position:absolute;left:18px;top:20px;width:300px}.controls button{display:inline-block;padding:9px;margin:4px;border:1px solid #555;background:#252332;color:white;cursor:pointer}.controls pre{font:11px monospace;white-space:pre-wrap;color:#b9bbcf;line-height:1.8}</style><div class="controls"><b>Validation de l’interface mobile</b><div><button id="more">Plus</button><button id="archives">Archives</button><button id="game">Ouvrir le jeu (aperçu)</button><button id="right">Droite</button><button id="escape">Échap</button></div><pre id="status"></pre></div><iframe id="phone" title="GameFlex mobile" src="experience-preview.html?interface=multiplayer&amp;console=nes&amp;letter=M"></iframe><script>const frame=document.getElementById('phone');function doc(){return frame.contentDocument}document.getElementById('more').onclick=()=>doc().querySelector('.em-dock button[aria-label="Plus de menus"]').click();document.getElementById('archives').onclick=()=>[...doc().querySelectorAll('.em-drawer nav button')].find(b=>b.textContent==='Archives')?.click();document.getElementById('game').onclick=()=>doc().querySelector('.gx-library-panel .em-poster')?.click();for(const [id,key]of [['right','ArrowRight'],['escape','Escape']])document.getElementById(id).onclick=()=>doc().activeElement?.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key,bubbles:true}));setInterval(()=>{const d=doc(),nav=d?.querySelector('.em-dock'),root=d?.querySelector('.em-app');if(!nav)return;document.getElementById('status').textContent=JSON.stringify({interface:root?.dataset.interface,viewport:frame.contentWindow.innerWidth,dockHeight:nav.getBoundingClientRect().height,dockButtons:nav.children.length,horizontalOverflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,drawer:!!d.querySelector('.em-drawer'),dialog:!!d.querySelector('.gx-launch-dialog'),focus:d.activeElement?.getAttribute('aria-label')||d.activeElement?.textContent?.slice(0,35),page:d.title},null,2)},200)</script></html>
