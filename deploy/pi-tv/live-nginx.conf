map $http_upgrade $gameflex_connection { default upgrade; '' close; }
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 16m;
    location = /experience-api/v1/imports {
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_pass http://gameflex-experience:10211/v1/imports;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /experience-api/v1/emugen/sources {
        proxy_pass http://gameflex-experience:10211/v1/emugen/sources;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
    }
    location = /experience-api/v1/emugen/verification {
        proxy_pass http://gameflex-experience:10211/v1/emugen/verification;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
    }
    location ^~ /experience-api/v1/emugen/verification/ {
        proxy_pass http://gameflex-experience:10211/v1/emugen/verification/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
    }
    location /experience-api/ {
        proxy_pass http://gameflex-experience:10211/;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }
    location ~ ^/api/v1/(auth|users|history|controller-mapping|key-mapping|key-positioning|notification-preferences|push|invites|presence|catalog-tokens|token-invitations|server-registry|mount-registry)(/|$) {
        proxy_pass http://gameflex-credential:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameflex_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
    location /api/v1/gateway-webrtc/ {
        proxy_pass http://gameflex-host-relay:10202;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameflex_connection;
        proxy_read_timeout 3600s;
    }
    location ~ ^/api/v1/(playstation|turn-config)(/|$) {
        default_type application/json;
        return 503 '{"success":false,"errorMessage":"Remote Play non déployé sur ce Pi"}';
    }
    location /api/ {
        set $kernel_upstream http://gameflex-kernel:8080;
        proxy_pass $kernel_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameflex_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
