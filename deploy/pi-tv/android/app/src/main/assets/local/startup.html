<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'"><title>GameFlex · Démarrage</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#263b55,#0d141f 65%);color:#f3f6fb;font:18px sans-serif;height:100vh;display:grid;place-items:center;user-select:none}main{width:min(800px,94vw);max-height:94vh;overflow:auto;border:1px solid #7189a744;border-radius:20px;padding:25px 32px;background:#1b293bea;box-shadow:0 30px 80px #0006}header{display:flex;align-items:center;gap:18px}header img{width:45px}small{font-size:11px;letter-spacing:.14em;color:#9eb4d0}h1{font-weight:400;letter-spacing:-.04em;font-size:30px;margin:7px 0 15px}p{color:#afc0d7;line-height:1.5;font-size:14px;margin:8px 0 16px}nav{display:flex;gap:10px;margin:15px 0}button,input{font:inherit;border-radius:12px;border:1px solid #a8c3e433;color:#ecf4ff;background:#18253a;min-height:44px;padding:10px 18px}button{cursor:pointer}nav button{flex:1;text-align:left;font-size:16px}button[aria-pressed=true],button.primary{background:#e8f1ff;color:#172b43}button:focus,input:focus{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 7px #8cbcff4d}input{display:block;width:100%;margin:9px 0;font-size:18px;user-select:text;background:#0f1a2b}label{display:block;font-size:13px;color:#b8cbe4}.remember{display:flex;align-items:center;gap:10px;margin:18px 0}.remember input{width:20px;height:20px;min-height:0;margin:0}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}.error{color:#ffc7b7;min-height:20px;font-size:13px}button:disabled{opacity:.5}section[hidden]{display:none}@media(max-height:600px){main{padding:18px 25px}h1{font-size:25px;margin:5px 0 8px}p{font-size:12px;margin:6px 0 10px}nav{margin:10px 0}.remember{margin:12px 0}.actions{margin-top:10px}}</style></head><body><main role="dialog" aria-modal="true" aria-labelledby="title"><header><img src="logo.png" alt=""><div><small>GAMEFLEX · ANDROID TV</small><h1 id="title">Connecter votre serveur</h1></div></header><section id="server"><p>Connectez votre Raspberry Pi, NAS ou PC GameFlex pour retrouver sa bibliothèque et ses émulateurs.</p><label>Adresse du serveur<input id="address" type="url" autocomplete="off" spellcheck="false" placeholder="http://adresse-IP-du-serveur:10200"></label></section><label class="remember"><input id="remember" type="checkbox">Utiliser ce choix aux prochains démarrages</label><p id="error" class="error" role="status"></p><div class="actions"><button id="cancel">Retour</button><button id="continue" class="primary">Connecter le serveur</button></div></main><script>
(()=>{const $=id=>document.getElementById(id);window.GameFlexSetup={configure(data){$('address').value=data.server||'';$('continue').focus();},error(message){$('error').textContent=message;document.querySelectorAll('button').forEach(b=>b.disabled=false);},move(direction){const list=[...document.querySelectorAll('button:not(:disabled),input')].filter(e=>e.getClientRects().length),el=document.activeElement;if(!list.includes(el)){list[0]?.focus();return;}const r=el.getBoundingClientRect(),dx=direction==='left'?-1:direction==='right'?1:0,dy=direction==='up'?-1:direction==='down'?1:0;const next=list.filter(e=>e!==el).map(e=>{const b=e.getBoundingClientRect(),x=b.x+b.width/2-r.x-r.width/2,y=b.y+b.height/2-r.y-r.height/2;return{e,a:x*dx+y*dy,s:Math.hypot(x,y)+2*Math.abs(x*dy-y*dx)}}).filter(v=>v.a>5).sort((a,b)=>a.s-b.s)[0];next?.e.focus();},activate(){const el=document.activeElement;if(el?.id==='address'){el.focus();return 'input';}el?.click();return 'button';}};const command=url=>{if(window.GameFlexNativePreview)window.GameFlexNativePreview(url);else location.href=url;};$('cancel').onclick=()=>command('gameflex-setup://cancel');$('continue').onclick=()=>{if(!$('address').value.trim()){GameFlexSetup.error('Saisissez l’adresse de votre serveur GameFlex.');return;}const url='gameflex-setup://connect?remember='+($('remember').checked?'1':'0')+'&url='+encodeURIComponent($('address').value.trim());document.querySelectorAll('button').forEach(b=>b.disabled=true);$('error').textContent='Vérification du serveur…';command(url);};document.addEventListener('keydown',e=>{if(e.target.id==='address')return;const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();GameFlexSetup.move(d);}else if(e.key==='Enter'){e.preventDefault();GameFlexSetup.activate();}});GameFlexSetup.configure(window.__setup||{});})();
</script></body></html>
