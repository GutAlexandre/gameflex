server {
    listen 8080;
    server_tokens off;
    client_max_body_size 512k;
    # No access log: authentication and personal query strings stay out of logs.
    access_log off;
    location = /experience-api/v1/imports {
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_pass http://experience:10211/v1/imports;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /experience-api/v1/emugen/sources {
        proxy_pass http://experience:10211/v1/emugen/sources;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
    }
    location = /experience-api/v1/emugen/verification {
        proxy_pass http://experience:10211/v1/emugen/verification;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
    }
    location ^~ /experience-api/v1/emugen/verification/ {
        proxy_pass http://experience:10211/v1/emugen/verification/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
    }
    location /experience-api/ {
        proxy_pass http://experience:10211/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }
    location / {
        proxy_pass http://gameflex-edge:8080;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
