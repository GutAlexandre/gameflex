    # GameFlex only: public NAS ingress, scoped to this domain and prefix.
    location = /gameflex {
        if ($host != loutrenas.myqnapcloud.com) { return 404; }
        absolute_redirect off;
        return 308 /gameflex/;
    }
    location ^~ /gameflex/ {
        if ($host != loutrenas.myqnapcloud.com) { return 404; }
        proxy_pass http://192.168.1.63:2000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $nasflix_public_scheme;
        proxy_set_header X-Forwarded-Prefix /gameflex;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nasflix_upgrade;
        # GameFlex uses a bearer session, not NASFLIX cookies.
        proxy_set_header Cookie "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        client_body_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
        error_log /var/log/nginx/error.log crit;
    }
